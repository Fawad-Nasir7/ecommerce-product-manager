<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Product Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            ShopManager
        </div>

        <nav>
            <a href="#products">Products</a>
            <a href="#manage">Manage</a>
            <button id="cartBtn" class="cart-btn">
                🛒 Cart <span id="cartCount">0</span>
            </button>
        </nav>

    </header>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div>
            <h1>E-Commerce Product Manager</h1>

            <p>
                Manage, search, filter and organize your products
                with JavaScript.
            </p>

            <a href="#products" class="hero-btn">
                Explore Products
            </a>
        </div>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <main id="products" class="container">

        <div class="section-heading">
            <h2>Product Management</h2>

            <button id="addProductBtn" class="primary-btn">
                + Add Product
            </button>
        </div>


        <!-- SEARCH & FILTER -->

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
                <option value="Sports">Sports</option>
            </select>

            <select id="sortProducts">

                <option value="default">
                    Sort Products
                </option>

                <option value="priceLow">
                    Price: Low to High
                </option>

                <option value="priceHigh">
                    Price: High to Low
                </option>

                <option value="nameAZ">
                    Name: A-Z
                </option>

                <option value="nameZA">
                    Name: Z-A
                </option>

                <option value="rating">
                    Highest Rating
                </option>

            </select>

            <input
                type="number"
                id="maxPrice"
                placeholder="Maximum price"
            >

        </div>


        <!-- PRODUCT COUNT -->

        <p class="product-count">
            Products found:
            <span id="productCount">0</span>
        </p>


        <!-- PRODUCTS -->

        <div id="productContainer" class="product-grid"></div>

    </main>


    <!-- ================= ADD PRODUCT MODAL ================= -->

    <div id="productModal" class="modal">

        <div class="modal-content">

            <button id="closeModal" class="close">
                ×
            </button>

            <h2 id="modalTitle">
                Add Product
            </h2>

            <form id="productForm">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product name"
                    required
                >

                <select id="productCategory" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Home">
                        Home
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                </select>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    min="1"
                    required
                >

                <input
                    type="number"
                    id="productRating"
                    placeholder="Rating 1-5"
                    min="1"
                    max="5"
                    step="0.1"
                    required
                >

                <input
                    type="number"
                    id="productStock"
                    placeholder="Stock"
                    min="0"
                    required
                >

                <input
                    type="text"
                    id="productImage"
                    placeholder="Image URL"
                    required
                >

                <textarea
                    id="productDescription"
                    placeholder="Product description"
                    required
                ></textarea>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Product
                </button>

            </form>

        </div>

    </div>


    <!-- ================= CART ================= -->

    <div id="cartModal" class="modal">

        <div class="modal-content cart-content">

            <button id="closeCart" class="close">
                ×
            </button>

            <h2>Shopping Cart</h2>

            <div id="cartItems"></div>

            <div class="cart-summary">

                <h3>
                    Total:
                    <span id="cartTotal">Rs. 0</span>
                </h3>

                <button
                    id="clearCart"
                    class="danger-btn"
                >
                    Clear Cart
                </button>

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>
</html>
